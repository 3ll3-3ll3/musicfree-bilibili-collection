name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v0.5.4 multi-link upgrade
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/upgrade_v054.py
      - name: Check MusicFree plugin syntax
        run: node --check musicfree_bilibili_collection.js
      - name: Commit v0.5.4 upgrade
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add musicfree_bilibili_collection.js README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: robust multi-link import in single-line input"
          git push
